<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0; padding:0; background:#f4f4f4; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background:#ffffff; border:1px solid #e6e6e6; border-radius:10px; overflow:hidden;">

            <!-- Nachrichtentext: hier änderst du für jede Mail den Inhalt -->
            <tr>
              <td style="padding:32px;">
                <div style="font-size:15px; line-height:1.65; color:#171717;">
                  Hallo [Name],<br /><br />

                  [Hier deinen Text einfügen.]<br /><br />

                  Viele Grüße<br />
                  Fynn
                </div>
              </td>
            </tr>

            <!-- Signatur: bleibt immer gleich -->
            <tr>
              <td style="padding:24px 32px; border-top:1px solid #e6e6e6;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="vertical-align:middle; padding-right:12px;">
                      <img src="https://fynnpetersen.de/logo.png" width="32" height="32" alt="Fynn Petersen" style="display:block; border-radius:7px;" />
                    </td>
                    <td style="vertical-align:middle;">
                      <div style="font-size:13px; font-weight:600; color:#171717;">Fynn Petersen</div>
                      <div style="font-size:12.5px; color:#8a8a8a;">
                        <a href="https://fynnpetersen.de" style="color:#8a8a8a; text-decoration:none;">fynnpetersen.de</a>
                        &nbsp;·&nbsp;
                        <a href="mailto:info@fynnpetersen.de" style="color:#8a8a8a; text-decoration:none;">info@fynnpetersen.de</a>
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
